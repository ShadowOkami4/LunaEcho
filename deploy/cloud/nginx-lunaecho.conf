# nginx site for the LunaEcho Cloud dashboard. certbot adds the TLS lines and the
# HTTP-to-HTTPS redirect when it issues the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name lunaecho.shadowokami.com;

    # Welcome card backgrounds may be up to 5 MB.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
